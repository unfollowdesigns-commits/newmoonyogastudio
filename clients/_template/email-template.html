<!-- Supabase → Authentication → Emails → Templates: paste into BOTH "Magic Link" and "Confirm signup" (Source view).
     Subject: Votre code STUDIO : {{ .Token }}
     Needs custom SMTP first (Emails → SMTP Settings), otherwise Supabase won't let you edit templates. -->
<div style="background:#f5f0ec;padding:32px 16px;font-family:Georgia,serif;color:#2f2a2c">
  <div style="max-width:440px;margin:0 auto;background:#fcf9f7;border-radius:24px;padding:32px 28px;text-align:center">
    <p style="margin:0;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#85797b">STUDIO NAME</p>
    <h1 style="margin:16px 0 8px;font-weight:normal;font-size:26px">Votre code de connexion</h1>
    <p style="margin:0 0 24px;font-family:Arial,sans-serif;font-size:14px;color:#85797b">Entrez ce code dans l'application.<br><span style="font-size:12px">Enter this code in the app.</span></p>
    <div style="display:inline-block;background:#6d5260;color:#fcf9f7;border-radius:16px;padding:14px 28px;font-family:Arial,sans-serif;font-size:32px;letter-spacing:10px">{{ .Token }}</div>
    <p style="margin:24px 0 0;font-family:Arial,sans-serif;font-size:12px;color:#85797b">Le code expire dans 1 heure. Si vous n'avez rien demandé, ignorez cet email.</p>
  </div>
</div>
